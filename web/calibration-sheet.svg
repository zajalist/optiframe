<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <rect width="210" height="297" fill="white"/>
  <text x="20" y="27" font-family="Arial,sans-serif" font-size="8" font-weight="bold">OPTIFRAME — 100 × 70 mm capture sheet</text>
  <text x="20" y="35" font-family="Arial,sans-serif" font-size="4">Print at 100%, no “fit to page”. Verify marker spacing with a ruler.</text>
  <defs>
    <pattern id="grid" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M 5 0 L 0 0 0 5" fill="none" stroke="#b5b5b5" stroke-width="0.22"/>
    </pattern>
  </defs>
  <rect x="55" y="70" width="100" height="70" fill="url(#grid)" stroke="#777" stroke-width="0.3"/>
  <g fill="#111">
    <rect x="52" y="67" width="6" height="6"/><rect x="152" y="67" width="6" height="6"/>
    <rect x="152" y="137" width="6" height="6"/><rect x="52" y="137" width="6" height="6"/>
  </g>
  <g fill="white">
    <circle cx="55" cy="70" r="0.8"/><circle cx="155" cy="70" r="0.8"/>
    <circle cx="155" cy="140" r="0.8"/><circle cx="55" cy="140" r="0.8"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="4" fill="#111">
    <text x="47" y="63">1</text><text x="160" y="63">2</text>
    <text x="160" y="148">3</text><text x="47" y="148">4</text>
    <text x="20" y="163">Tap centres 1 → 2 → 3 → 4 in the app. Keep all four visible around the lens.</text>
    <text x="20" y="173">Set the sheet flat on a matte surface. Take an empty view, then a lens view.</text>
    <text x="20" y="183">Move lights or camera to displace reflections. Do not move the sheet.</text>
    <text x="20" y="203">Check: the line below must measure 50 mm.</text>
  </g>
  <path d="M 50 213 H 100 M 50 210 V 216 M 100 210 V 216" stroke="#111" stroke-width="0.5"/>
  <text x="67" y="220" font-family="Arial,sans-serif" font-size="5">50 mm</text>
</svg>
