<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101112">
  <title>OptiFrame — lens capture</title>
  <link rel="stylesheet" href="/simple.css?v=18">
  <link rel="stylesheet" href="/tutorial.css?v=14">
  <link rel="stylesheet" href="/glass.css?v=14">
</head>
<body>
  <div class="app">
    <header class="header"><a class="brand" href="/welcome.html" data-preserve-access aria-label="About OptiFrame">OptiFrame</a><div class="header-actions"><a class="sheet-link" href="/calibration-sheet.svg" target="_blank" rel="noopener">Print sheet</a><button class="help-button" type="button" data-tutorial="capture">Help</button></div></header>
    <main class="capture">
      <div class="heading">
        <div class="heading-row"><h1 id="headline">First lens</h1><span id="step-label" aria-label="Capture progress">1 of 2</span></div>
        <p id="instruction"></p>
      </div>
      <div class="stage" id="stage">
        <div class="empty" id="empty">Opening camera…</div>
        <div class="camera-frame" id="camera-frame" hidden><video id="camera" playsinline muted autoplay aria-label="Live lens camera"></video><canvas id="camera-overlay" aria-label="Live lens outline"></canvas></div>
        <canvas id="review-canvas" aria-label="Captured lens. Press and drag for precise adjustment." hidden></canvas>
        <svg id="result-svg" viewBox="0 0 320 220" role="img" aria-label="Measured lens outline" hidden><path id="result-path" d=""></path><g id="result-dimensions"></g></svg>
        <div id="pair-results" hidden>
          <section class="lens-result"><div class="lens-caption"><span>Left lens</span><button id="retry-left" type="button">Retry</button></div><svg id="left-svg" viewBox="0 0 320 220" role="img" aria-label="Left lens outline"><path id="left-path"></path><g id="left-dimensions"></g></svg></section>
          <section class="lens-result"><div class="lens-caption"><span>Right lens</span><button id="retry-right" type="button">Retry</button></div><svg id="right-svg" viewBox="0 0 320 220" role="img" aria-label="Right lens outline"><path id="right-path"></path><g id="right-dimensions"></g></svg></section>
        </div>
        <label id="photo-label" class="photo-import" for="photo-input" aria-label="Use a photo" tabindex="0"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m4 18 6-6 4 4 3-3 4 4"/></svg><span>Photo</span><input id="photo-input" type="file" accept="image/*"></label>
        <button id="camera-retry" type="button" hidden>Retry camera</button>
      </div>
      <div class="action-area">
        <p id="status" role="status" aria-live="polite"></p>
        <div class="controls"><button id="secondary" class="secondary" type="button" hidden>Retry</button><button id="primary" class="primary" type="button" hidden aria-label="Confirm lens">Confirm</button></div>
      </div>
    </main>
  </div>
  <button id="controller-capture" type="button" hidden disabled></button>
  <script type="module" src="/simple.js?v=18"></script>
  <script src="/tutorial.js?v=15" defer></script>
  <script src="/navigation.js?v=12" defer></script>
</body>
</html>
